<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <rect width="920" height="380" fill="#ffffff"/>
  <text x="40" y="36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">Bewegungsprofil: konstante Beschleunigung</text>

  <text x="170" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">s/t</text>
  <line x1="90" y1="300" x2="390" y2="300" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="300" x2="90" y2="90" stroke="#111827" stroke-width="2"/>
  <text x="396" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">t</text>
  <text x="74" y="86" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">s</text>
  <polyline points="100,285 150,275 200,245 250,200 300,155 350,125" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="300" x2="100" y2="285"/>
    <line x1="150" y1="300" x2="150" y2="275"/>
    <line x1="200" y1="300" x2="200" y2="245"/>
    <line x1="250" y1="300" x2="250" y2="200"/>
    <line x1="300" y1="300" x2="300" y2="155"/>
    <line x1="350" y1="300" x2="350" y2="125"/>
  </g>
  <g fill="#0f766e">
    <circle cx="100" cy="285" r="5"/>
    <circle cx="150" cy="275" r="5"/>
    <circle cx="200" cy="245" r="5"/>
    <circle cx="250" cy="200" r="5"/>
    <circle cx="300" cy="155" r="5"/>
    <circle cx="350" cy="125" r="5"/>
  </g>

  <text x="590" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">v/t</text>
  <line x1="510" y1="300" x2="810" y2="300" stroke="#111827" stroke-width="2"/>
  <line x1="510" y1="300" x2="510" y2="90" stroke="#111827" stroke-width="2"/>
  <text x="816" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">t</text>
  <text x="496" y="86" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">v</text>
  <polyline points="520,300 550,255 600,185 650,185 700,185 750,255 800,300" fill="none" stroke="#dc2626" stroke-width="4"/>
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="550" y1="300" x2="550" y2="255"/>
    <line x1="600" y1="300" x2="600" y2="185"/>
    <line x1="650" y1="300" x2="650" y2="185"/>
    <line x1="700" y1="300" x2="700" y2="185"/>
    <line x1="750" y1="300" x2="750" y2="255"/>
