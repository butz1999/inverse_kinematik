  <g fill="#0f766e">
    <circle cx="550" cy="255" r="5"/>
    <circle cx="600" cy="185" r="5"/>
    <circle cx="650" cy="185" r="5"/>
    <circle cx="700" cy="185" r="5"/>
    <circle cx="750" cy="255" r="5"/>
