[platformio]
default_envs = esp32s3

[env]
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3

[esp32s3_common]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM

[env:native]
platform = native
build_flags =
    -std=gnu++17
build_src_filter =
    +<application/ApiContracts.cpp>
    +<application/ApiJson.cpp>
    +<application/RunEngine.cpp>
    +<hardware/HardwareCalibration.cpp>
    +<hardware/Pca9685ServoDriverConfig.cpp>
    +<hardware/StatusLed.cpp>
    +<orchestration/MotionOrchestrator.cpp>
    +<orchestration/MotionProfileGenerator.cpp>
    +<robotics/Kinematics.cpp>
    +<robotics/RobotModel.cpp>
    +<robotics/Validation.cpp>
test_build_src = yes

[env:esp32s3_arduino_native]
# Keep this environment intentionally. It is the lean Arduino-only build used
# as a comparison and bring-up path, while esp32s3 is the current
# firmware default for the controller PoC.
extends = esp32s3_common
platform = espressif32
framework = arduino
build_src_filter =
    +<*>
    -<bluepad32_app_main.c>
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
test_framework = unity
test_speed = 115200
monitor_filters =
    time
    esp32_exception_decoder
debug_tool = esp-builtin
debug_init_break =
debug_init_cmds =
    define pio_reset_halt_target
        monitor reset halt
        flushregs
    end
    define pio_reset_run_target
        monitor reset
    end
    target extended-remote $DEBUG_PORT
    $LOAD_CMDS
    pio_reset_halt_target
debug_extra_cmds =
    set remotetimeout 60
    set scheduler-locking step
    set remote hardware-breakpoint-limit 2
    set remote hardware-watchpoint-limit 2
    monitor gdb_breakpoint_override hard
platform_packages =
    platformio/tool-xtensa-esp-elf-gdb@14.2.0+20240403
extra_scripts =
    pre:scripts/use_modern_esp32s3_gdb.py
build_type = debug
build_unflags =
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${esp32s3_common.build_flags}
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0

[env:esp32s3]
# Current firmware default. This environment uses ESP-IDF with Arduino
# compatibility because the Bluepad32 controller PoC needs local ESP-IDF
# components and a larger partition layout.
extends = esp32s3_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = espidf
board_build.partitions = partitions_bluepad32.csv
monitor_filters = direct
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
lib_deps =
build_flags =
    ${esp32s3_common.build_flags}
    -DIK_REQUIRE_BLUEPAD32
